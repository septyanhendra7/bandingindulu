<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "id" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}})();
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <nav class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 font-bold text-sky-600 dark:text-sky-400">
        <span class="text-xl">⚔️</span> BandinginDulu
      </a>
      <div class="ml-auto flex items-center gap-4 text-sm font-medium">
        <a href="/" class="hover:text-sky-600 dark:hover:text-sky-400">Beranda</a>
        <a href="/artikel/" class="hover:text-sky-600 dark:hover:text-sky-400">Artikel</a>
        <button id="themeToggle" class="w-9 h-9 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800" title="Ganti tema">🌙</button>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 mt-12">
    <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col sm:flex-row justify-between gap-4 text-sm text-slate-500 dark:text-slate-400">
      <div>
        <b class="text-sky-600 dark:text-sky-400">BandinginDulu</b> · bandingkan dulu sebelum beli
        <p class="mt-1">Analisis spesifikasi, bukan pengalaman pakai.</p>
      </div>
      <div class="flex gap-4">
        <a href="/artikel/" class="hover:text-sky-600">Artikel</a>
        <a href="/index.json" class="hover:text-sky-600">Cari</a>
      </div>
    </div>
  </footer>

  <script>
    var btn=document.getElementById('themeToggle');
    function upd(){btn.textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙'}
    upd();
    if(btn)btn.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');localStorage.setItem('theme',d?'dark':'light');upd()});
  </script>
</body>
</html>
