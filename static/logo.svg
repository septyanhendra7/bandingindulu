<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="phA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="phB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- rounded square badge -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- left phone -->
  <g transform="translate(96,120)">
    <rect x="0" y="0" width="120" height="272" rx="22" fill="url(#phA)" stroke="#0f172a" stroke-width="8"/>
    <rect x="14" y="18" width="92" height="200" rx="10" fill="#0284c7" opacity="0.18"/>
    <circle cx="60" cy="248" r="10" fill="#0284c7"/>
  </g>
  <!-- right phone -->
  <g transform="translate(296,120)">
    <rect x="0" y="0" width="120" height="272" rx="22" fill="url(#phB)" stroke="#0f172a" stroke-width="8"/>
    <rect x="14" y="18" width="92" height="200" rx="10" fill="#d97706" opacity="0.22"/>
    <circle cx="60" cy="248" r="10" fill="#d97706"/>
  </g>
  <!-- VS badge -->
  <g transform="translate(256,256)">
    <circle cx="0" cy="0" r="54" fill="#0f172a"/>
    <text x="0" y="16" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">VS</text>
  </g>
</svg>